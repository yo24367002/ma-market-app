name: Daily Market Data

on:
  schedule:
    # 日本时间每天 08:00（UTC 23:00）更新一次
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install yfinance==1.7.0

      - name: Fetch market data + indicators
        run: python scripts/fetch_data.py

      - name: AI analysis (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_analysis.py

      - name: Publish data.json to web
        run: |
          mkdir -p web
          cp scripts/data.json web/data.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json scripts/data.json
          git diff --cached --quiet || git commit -m "daily market data update"
          git push
